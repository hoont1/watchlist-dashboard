<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리밸런싱 체크 도구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="date" id="today-date"></div>
  <h1>리밸런싱 체크 도구</h1>
</header>

<section class="panel client-bar">
  <h2>고객 등록</h2>
  <p class="sub">고객명과 점검일을 입력해 등록하고, 아래 카드를 클릭해 점검할 고객을 선택하세요.</p>

  <form class="add-form" id="client-form">
    <input class="client-name-input" id="client-name" type="text" placeholder="고객명" required>
    <input class="client-date-input" id="client-date" type="date" required>
    <button type="submit">+ 고객 등록</button>
  </form>

  <div class="card-grid" id="client-cards"></div>
</section>

<main class="layout">
  <section class="panel">
    <h2>자산군별 비중 입력</h2>
    <p class="sub" id="holding-panel-sub">위에서 고객을 먼저 선택하세요.</p>

    <form class="add-form" id="holding-form">
      <input class="asset-name-input" id="holding-asset" type="text" placeholder="자산군명 (예: 국내주식)" required>
      <input class="weight-input" id="holding-actual" type="number" step="0.1" min="0" max="100" placeholder="보유비중(%)" required>
      <input class="weight-input" id="holding-target" type="number" step="0.1" min="0" max="100" placeholder="목표비중(%)" required>
      <button type="submit">+ 추가</button>
    </form>

    <ul id="holding-list"></ul>
  </section>

  <aside>
    <section class="panel">
      <h2>이탈률 결과</h2>
      <p class="sub">이탈 기준: 보유비중 − 목표비중이 ±5%p를 초과하면 리밸런싱 필요로 표시합니다.</p>
      <div class="card-grid" id="deviation-cards"></div>
    </section>

    <section class="panel">
      <h2>리밸런싱 필요 고객</h2>
      <ul id="rebalance-list"></ul>
    </section>

    <section class="panel">
      <h2>다음 점검 리마인더</h2>
      <p class="sub">마지막 점검일로부터 7일이 지난 고객을 보여줍니다.</p>
      <ul id="reminder-list"></ul>
    </section>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
